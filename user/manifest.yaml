apiVersion: v1
kind: ConfigMap
metadata:
  name: user
  labels:
    component: user
    project: roboshop
    env: dev
    tier: app
data:
  MONGO: "true" 
  REDIS_URL: "redis://redis:6379" 
  MONGO_URL: "mongodb://mongodb:27017/users"
---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: user 
  labels:
    component: user
    project: roboshop
    env: dev
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      component: user
      project: roboshop
      env: dev
      tier: app
  template:
    metadata:
      labels:
        component: user
        project: roboshop
        env: dev
        tier: app
    spec:
      containers:
        - name: user
          image: shanmukhatadisetti/user:v1
          envFrom:
          - configMapRef:
              name: user
---
apiVersion: v1
kind: Service
metadata:
  name: user
  labels: 
    component: user
    project: roboshop
    env: dev
    tier: app
spec:
  selector:
    component: user
    project: roboshop
    env: dev
    tier: app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080