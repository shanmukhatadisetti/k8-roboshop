apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: catalogue 
  labels:
    component: catalogue
    project: roboshop
    env: dev
    tier: app
spec:
  replicas: 2
  selector:
    matchLabels:
      component: catalogue
      project: roboshop
      env: dev
      tier: app
  template:
    metadata:
      lables:
        component: catalogue
        project: roboshop
        env: dev
        tier: app
    spec:
      containers:
        - name: catalogue
          image: shanmukhatadisetti/catalogue:v1
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  labels: 
    component: catalogue
    project: roboshop
    env: dev
    tier: app
spec:
  selector:
    component: catalogue
    project: roboshop
    env: dev
    tier: app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080